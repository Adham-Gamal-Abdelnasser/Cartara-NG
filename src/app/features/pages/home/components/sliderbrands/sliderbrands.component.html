<section class="card m-4">
    <p-carousel [value]="brands()" [numVisible]="3" [numScroll]="3" [circular]="true" [responsiveOptions]="responsiveOptions" autoplayInterval="5000">
        <ng-template let-brand #item >
            <img [src]="brand.image" [alt]="brand.name" class="w-full" />
        </ng-template>
    </p-carousel>
</section>
